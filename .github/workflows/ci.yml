name: CI

on:
  push:
    # Все ветки, а не только main: работа идёт в ветках (CLAUDE.md, п. 1.5),
    # и проверять их надо до вливания. Шаблон веток не совпадает с тегами,
    # поэтому тег, который ставит semantic-release, лишний прогон не запускает.
    branches: ["**"]
  pull_request:

# По умолчанию — только чтение. Право на запись выдаётся точечно job'у release.
permissions:
  contents: read

env:
  # Git-хуки husky нужны только на машине разработчика. В CI они вредны:
  # @semantic-release/git делает свой коммит `chore(release): ...`, тот проходит
  # через commit-msg и падает на сгенерированных release notes — длинные строки
  # со ссылками не проходят body-max-line-length. Формат коммитов в CI проверяет
  # отдельный job commitlint, а не хук.
  HUSKY: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: ./.github/install-deps.sh

      - run: npm run build
      - run: npm test
      - run: npm run lint

  commitlint:
    name: сообщения коммитов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint сравнивает диапазон коммитов — нужна полная история.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: ./.github/install-deps.sh

      - name: Проверить формат сообщений
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          EMPTY_SHA=0000000000000000000000000000000000000000

          if [ "$EVENT" = "pull_request" ]; then
            FROM="$PR_BASE"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$EMPTY_SHA" ]; then
            # Первый push новой ветки: предыдущего состояния нет. Берём точку
            # ветвления от main, иначе проверился бы только последний коммит,
            # а в ветке их обычно несколько.
            FROM="$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo '')"
          else
            FROM="$PUSH_BEFORE"
          fi

          if [ -z "$FROM" ]; then
            echo "Нет предыдущего коммита для сравнения — пропускаем."
            exit 0
          fi

          echo "Проверяем коммиты $FROM..$HEAD_SHA"
          npx --no -- commitlint --from "$FROM" --to "$HEAD_SHA" --verbose

  release:
    name: semantic-release
    needs: [verify, commitlint]
    # Релиз только из main и только на push: PR ничего не выпускает.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # тег, коммит с CHANGELOG, GitHub Release
      issues: write          # комментарии semantic-release в issues
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # semantic-release авторизуется своим GITHUB_TOKEN;
          # сохранённые креды actions/checkout ему мешают.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: ./.github/install-deps.sh

      - run: npx --no -- semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
