# Пример конфигурации pve-vm-autoscaler.
#
# Файл разделён по частоте изменения: nodeTemplates описывает, ЧТО создавать,
# и правится редко; policies описывает, КОГДА масштабировать, и тюнится постоянно.
#
# Проверить файл, не поднимая сервер:
#   npm run policy:validate -- infra/policy.example.yaml

version: 1

# ---------------------------------------------------------------------------
# Шаблоны машин. Один шаблон могут использовать несколько политик.
# ---------------------------------------------------------------------------
nodeTemplates:
  worker:
    # Нода Proxmox, на которой создаются VM. Не путать с воркер-VM: их считают nodes.min/max.
    hypervisor: proxmox

    # VM-шаблон для клонирования. В нём уже должны стоять и приложение, и агент:
    # установка пакетов при загрузке съедает минуты ровно тогда, когда нужна ёмкость.
    templateVmId: 100

    namePrefix: autoscaled-worker

    cpu: 2          # ядра
    memory: 2Gi
    disk: 20Gi

    # Имя диска зависит от того, как собран шаблон: virtio0, scsi0, sata0.
    diskDevice: virtio0

    # Linked clone создаётся за секунды, но привязан к шаблону:
    # удалить или переместить шаблон, пока живы клоны, не выйдет.
    linkedClone: true
    startOnCreate: true

    # По этим тегам автоскейлер отличает свои VM от чужих — в том числе при удалении.
    tags:
      - pve-vm-autoscaler
      - worker

# ---------------------------------------------------------------------------
# Политики масштабирования.
# ---------------------------------------------------------------------------
policies:
  - name: default-workers
    enabled: true
    template: worker

    # Метки агента, попадающего под политику. Пустой селектор совпадает со всеми нодами.
    selector:
      role: worker

    nodes:
      min: 1
      max: 5

    # Окно усреднения. Должно быть заметно больше интервала отправки метрик агентом
    # (AGENT_INTERVAL_MS, по умолчанию 10s), иначе решение принимается по одному-двум
    # сэмплам и пул начинает дёргаться на случайных всплесках.
    window: 2m

    scaleUp:
      cpu: 60%
      memory: 80%
      disk: 90%

      # Пауза после масштабирования. Должна перекрывать время загрузки новой VM
      # и старта агента, иначе автоскейлер добавит вторую машину, не увидев первую.
      cooldown: 5m

    # Заработает в Milestone 4. Порог намеренно много ниже порога роста: если свести их
    # близко, пул начнёт осциллировать между добавлением и удалением машин.
    scaleDown:
      cpu: 20%
      memory: 30%
      cooldown: 10m
